# Base de datos local para desarrollo:  docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: avicola
    ports:
      - '5432:5432'
    volumes:
      - avicola_pg:/var/lib/postgresql/data

volumes:
  avicola_pg:
